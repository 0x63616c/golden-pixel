# PR titles are Conventional Commits (they become the squash-merge commit).
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-24.04
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          [[ "$TITLE" =~ ^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?:\ .+ ]] \
            || { echo "::error::PR title must be a Conventional Commit, e.g. 'feat(fog): sonar pings'"; exit 1; }
