# One-time (idempotent): register the bundle ID, find or create the App Store Connect app
# record, and make the internal TestFlight group. Manual, owner-only.
name: App Store Connect setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    if: github.repository == '0x63616c/golden-pixel' && github.ref == 'refs/heads/main' && github.actor == '0x63616c'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: testflight
    env:
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: bundle exec fastlane ios setup
